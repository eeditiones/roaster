# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test

# push only on main: release.yml needs the push run there, and branches with
# a pull request are tested by the pull_request event, merged into main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (exist ${{ matrix.exist-version }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        exist-version: [6.0.1, 5.5.1, 6.4.1]
        experimental: [false]
        # eXist 7 (latest and the rolling release image) must pass as well.
        # Set `experimental: true` on an entry to let it fail without failing
        # the run again, e.g. while an upcoming eXist version breaks things.
        include:
          # multipart uploads fail since eXist-db/exist#6731: a map holding an
          # uploaded file throws a NullPointerException in containsReference
          - exist-version: latest
            experimental: true
          - exist-version: release
            experimental: false
    services:
      exist:
        image: existdb/existdb:${{ matrix.exist-version }}
        ports:
          - 8443:8443
        volumes:
          # point autodeploy to a folder without any XARs
          - ${{ github.workspace }}/doc:/exist/autodeploy
        options: >-
          --health-interval 4s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:ci
